<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTK Teknisyen Raporu</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="report-body">
    <main class="report-shell">
      <section class="report-header">
        <div>
          <p class="eyebrow">MTK canlı rapor</p>
          <h1>Teknisyen Üretim Tablosu</h1>
          <p class="report-subtitle">
            Test aşamasına çekilen cihazlar teknisyene göre onarıldı, yenileme ve toplam olarak listelenir.
          </p>
        </div>

        <form id="reportForm" class="report-controls">
          <label>
            Tarih
            <input id="reportDate" type="date" />
          </label>
          <button type="submit">Yenile</button>
        </form>
      </section>

      <section class="report-summary" aria-live="polite">
        <div class="summary-card">
          <span>Onarıldı</span>
          <strong id="totalRepaired">0</strong>
        </div>
        <div class="summary-card renewal">
          <span>Yenileme</span>
          <strong id="totalRenewal">0</strong>
        </div>
        <div class="summary-card total">
          <span>Genel Toplam</span>
          <strong id="totalAll">0</strong>
        </div>
      </section>

      <section class="report-table-wrap">
        <div id="statusBox" class="report-status">Rapor yükleniyor...</div>

        <table class="mtk-report-table" aria-label="MTK teknisyen raporu">
          <thead>
            <tr>
              <th>Teknisyen</th>
              <th>Onarıldı</th>
              <th>Yenileme</th>
              <th>Toplam</th>
            </tr>
          </thead>
          <tbody id="reportRows"></tbody>
          <tfoot>
            <tr>
              <th>Genel Toplam</th>
              <td id="footerRepaired">0</td>
              <td id="footerRenewal">0</td>
              <td id="footerAll">0</td>
            </tr>
          </tfoot>
        </table>
      </section>
    </main>

    <script src="/mtk-rapor.js" type="module"></script>
  </body>
</html>
