<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Teknisyen Test | Dijital Test Kağıdı</title>
    <meta name="theme-color" content="#38bdf8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
  </head>

  <body class="test-page technician-test-page">
    <a class="skip-link" href="#mainContent">Teknisyen test ekranına geç</a>

    <main id="mainContent" class="app-shell test-shell">
      <header class="hero test-hero">
        <div class="hero-copy">
          <div class="eyebrow-row">
            <p class="eyebrow">Teknisyen Dijital Test Kağıdı</p>
          </div>

          <h3>Teknisyen Test</h3>

          <p class="subtitle">
            Testleri klavye üzerinden hızlıca işaretleyin.
            <kbd>1</kbd> OK,
            <kbd>2</kbd> RED,
            <kbd>Backspace</kbd> geri alır.
          </p>
        </div>

        <div class="hero-stack" role="list" aria-label="Klavye kısayolları">
          <div class="hero-stat ok-stat" role="listitem">
            <span>OK</span>
            <strong><kbd>1</kbd></strong>
          </div>

          <div class="hero-stat red-stat" role="listitem">
            <span>RED</span>
            <strong><kbd>2</kbd></strong>
          </div>

          <div class="hero-stat" role="listitem">
            <span>Geri Al</span>
            <strong><kbd>Backspace</kbd></strong>
          </div>

          <div class="hero-stat" role="listitem">
            <span>Kaydet</span>
            <strong><kbd>Space</kbd></strong>
          </div>
        </div>

        <a class="records-link" href="/teknisyen-test-kayitlari">Teknisyen Kayıtları</a>
      </header>

      <section class="test-board" aria-labelledby="testBoardTitle">
        <h2 id="testBoardTitle" class="visually-hidden">Teknisyen test bilgileri</h2>

        <form id="testForm" autocomplete="off" novalidate onsubmit="return false">
          <div class="test-top-grid">
            <label class="test-field" for="testDate">
              <span>Tarih</span>
              <input id="testDate" name="testDate" type="date" autocomplete="off">
            </label>

            <label class="test-field" for="testModel">
              <span>Model</span>
              <input id="testModel" name="testModel" type="text" placeholder="Örn. iPhone 13" autocomplete="off" autocapitalize="characters" spellcheck="false">
            </label>

            <label class="test-field" for="testGb">
              <span>Hafıza</span>
              <div class="input-suffix">
                <input id="testGb" name="testGb" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="128" autocomplete="off" spellcheck="false" aria-label="Cihaz hafızası">
                <span aria-hidden="true">GB</span>
              </div>
            </label>

            <label class="test-field test-code-field" for="testOrderCode">
              <span>Sipariş Kodu</span>
              <input id="testOrderCode" name="testOrderCode" type="text" placeholder="Örn. MED-12345" autocomplete="off" autocapitalize="characters" spellcheck="false">
            </label>

            <div class="test-summary ok-summary" aria-label="Toplam başarılı test">
              <span>OK</span>
              <strong id="okCount" aria-live="polite">0</strong>
            </div>

            <div class="test-summary red" aria-label="Toplam başarısız test">
              <span>RED</span>
              <strong id="redCount" aria-live="polite">0</strong>
            </div>

            <div class="test-summary final-summary" aria-label="Test sonucu">
              <span>SONUÇ</span>
              <strong id="finalStatus" aria-live="polite">-</strong>
            </div>
          </div>

          <div class="test-progress">
            <div class="test-progress-copy">
              <span id="progressText" aria-live="polite">0 / 12 tamamlandı</span>
              <strong id="activeText" aria-live="polite">İlk test: Ekran</strong>
            </div>

            <button class="secondary-button" type="button" id="clearButton" aria-controls="testTable">
              <span aria-hidden="true">↻</span>
              Temizle
            </button>
          </div>

          <div class="test-progress-bar" role="progressbar" aria-label="Test tamamlanma oranı" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0">
            <span id="progressBar"></span>
          </div>

          <div class="test-table" id="testTable" role="grid" aria-label="Teknisyen cihaz testleri" tabindex="0"></div>

          <label class="test-note visible-test-note bottom-note-area" for="testNote">
            <span>Notlar</span>
            <textarea id="testNote" name="testNote" rows="5" placeholder="Cihazla ilgili ek not yazın..." autocomplete="off" spellcheck="false"></textarea>

            <button class="primary-button send-test-button bottom-send-button" type="button" id="sendButton" aria-controls="testTable">
              Gönder
            </button>
          </label>
        </form>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

    <script src="/pwa.js" defer></script>
    <script src="/technician-test.js" defer></script>
  </body>
</html>
