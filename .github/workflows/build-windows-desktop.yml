name: Windows Desktop EXE Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build HB Kalite Kontrol
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        working-directory: hb-kalite-kontrol-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hb-kalite-kontrol-desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Sign Windows executables
        if: ${{ env.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "hb-kalite-kontrol-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found."
          }

          $files = @()
          $files += Get-ChildItem "src-tauri\target\release" -Filter "*.exe" -File
          $files += Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue

          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
          }

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: HB-Kalite-Kontrol-portable-exe
          path: hb-kalite-kontrol-desktop/src-tauri/target/release/*.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: HB-Kalite-Kontrol-setup
          path: hb-kalite-kontrol-desktop/src-tauri/target/release/bundle/nsis/*.exe
